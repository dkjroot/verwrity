<dialog id="dictate-draft-dialog" class="file-dialog draft-dialog" aria-labelledby="draft-title">
  <div class="file-dialog-heading"><h2 id="draft-title">Dictate draft</h2><button type="button" data-draft-hide aria-label="Hide Dictate draft">×</button></div>
  <div class="draft-body">
    <p>Record a longer piece or import a voice note, then read through the transcript. For each section, keep the raw text or review the cleanup.</p>
    <p data-draft-providers></p>
    <label><input type="checkbox" data-draft-cleanup> Automatically run LLM cleanup on all chunks</label>
    <label data-draft-consent-label hidden><input type="checkbox" data-draft-consent> <span data-draft-consent-text></span></label>
    <div class="draft-recording-controls">
      <p data-draft-status role="status" aria-live="polite"></p>
      <p data-draft-error role="alert"></p>
      <div class="draft-actions">
      <button type="button" data-draft-import>Import audio file</button><input type="file" data-draft-audio-file accept="audio/*,.wav,.mp3,.m4a,.aac,.flac,.ogg,.opus,.webm,.aif,.aiff,.wma,.amr,.3gp,.mp4" hidden>
      <span class="recording-actions" role="group" aria-label="Recording">
      <button type="button" data-draft-start>Start recording</button><button type="button" data-draft-pause>Pause recording</button>
      <button type="button" data-draft-resume>Resume recording</button><button type="button" data-draft-boundary>Page turn / chunk boundary</button>
      <button type="button" data-draft-finish>Finish recording</button></span><button type="button" data-draft-cancel>Cancel queued work</button>
      <button type="button" data-draft-cleanup-all>Run cleanup for all sections</button>
      <button type="button" data-draft-new>Clear / start fresh</button>
      </div>
    </div>
    <p data-draft-import-status role="status" aria-live="polite"></p>
    <label>Extra words for this dictation<textarea rows="2" data-draft-vocabulary placeholder="Words, separated by commas"></textarea></label>
    <p>LLM cleanup uses your Project Words and any extra words above.</p>
    <div class="draft-review-layout">
      <nav aria-label="Recorded chunks"><label><input type="checkbox" data-draft-unresolved> Only unresolved chunks</label><div data-draft-chunks></div></nav>
      <section class="draft-selected-review" aria-label="Review selected chunk">
        <p data-draft-chunk-status role="status" aria-live="polite"></p>
        <div class="draft-comparison">
          <section class="draft-transcript-pane"><label class="draft-transcript-heading" for="draft-raw">Original raw transcript</label><textarea id="draft-raw" rows="7" data-draft-raw readonly></textarea></section>
          <section class="draft-transcript-pane" aria-labelledby="draft-cleaned-title"><p id="draft-cleaned-title" class="draft-transcript-heading">Proposed cleanup</p><div class="draft-cleanup-preview" data-draft-cleaned role="document" aria-labelledby="draft-cleaned-title" tabindex="0"></div><p class="draft-cleanup-note" data-draft-cleanup-note></p></section>
        </div>
        <div class="draft-actions draft-choice-actions"><button type="button" data-draft-use-raw>Keep raw</button><button type="button" data-draft-use-cleaned>Use reviewed cleanup</button></div>
        <label>Your reviewed passage<textarea rows="8" data-draft-review></textarea></label>
        <div class="draft-actions"><button type="button" data-draft-retry>Retry transcription</button><button type="button" data-draft-reclean>Run / rerun cleanup</button><button type="button" data-draft-delete-audio>Delete this audio</button></div>
      </section>
    </div>
    <p data-draft-destination></p>
    <p data-draft-approved-summary role="status" aria-live="polite"></p>
    <div class="app-dialog-actions">
    <button type="button" data-draft-approve-all>Auto-approve all</button>
    <button type="button" data-draft-hide>Hide dialog to choose manuscript caret location</button>
    <button type="button" data-draft-insert>Insert approved sections at caret</button></div>
  </div>
</dialog>
